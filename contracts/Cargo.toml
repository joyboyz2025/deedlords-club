[workspace]
resolver = "2"
members = ["engine", "deedlords", "arena-engine", "arena", "chibi"]

# Settings for the NEAR contract wasm (small, deterministic, abort on panic).
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = true

[package]
name = "deedlords-poker-table"
version = "0.1.0"
edition = "2021"
description = "Deedlords Poker NEAR contract for tables of two to nine seats: Texas Hold'em dealt as mental poker (ElGamal over BN254, every shuffle proved, proofs checked by the chain's own curve functions)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

# Its own workspace, so building it does not touch the lock file or the target directory of the other contracts.
[workspace]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = true

# The curve library is very slow unoptimized, and the tests make and check whole shuffle proofs with it.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 2

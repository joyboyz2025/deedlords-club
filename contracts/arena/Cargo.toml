[package]
name = "deedlords-arena"
version = "0.1.0"
edition = "2021"
description = "Deedlords Arena NEAR contract: stakes, sealed plans (commit and reveal), the market draw and the payout around the arena-engine rules."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arena-engine = { path = "../arena-engine" }
near-sdk = "5.27.0"

[dev-dependencies]
near-sdk = { version = "5.27.0", features = ["unit-testing"] }

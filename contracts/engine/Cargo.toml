[package]
name = "deedlords-engine"
version = "0.1.0"
edition = "2021"
description = "Deedlords game rules: deterministic, integer-only port of the TypeScript engine (see docs/ENGINE-RULES.md)."
publish = false
build = "build.rs"

[lib]
name = "deedlords_engine"
path = "src/lib.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }

[build-dependencies]
serde_json = "1"
